<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mental Health Treatment Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f7fc;">
    <div class="container mt-4 p-4 bg-white rounded shadow" style="max-width:900px;">

        <h2 class="text-center text-primary">Mental Health Treatment Prediction</h2>

        <form>
            <label>Gender</label>
            <select id="gender" class="form-select mb-2">
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
            </select>

            <label>Country</label>
            <select id="country" class="form-select mb-2">
                <option value="">Select</option>
                <option>United States</option>
                <option>United Kingdom</option>
                <option>Canada</option>
                <option>Australia</option>
                <option>India</option>
                <option>Germany</option>
                <option>France</option>
                <option>Netherlands</option>
                <option>Sweden</option>
                <option>Ireland</option>
                <option>Brazil</option>
                <option>New Zealand</option>
                <option>South Africa</option>
                <option>Switzerland</option>
                <option>Israel</option>
                <option>Italy</option>
                <option>Belgium</option>
                <option>Denmark</option>
                <option>Singapore</option>
                <option>Finland</option>
                <option>Portugal</option>
                <option>Nigeria</option>
                <option>Philippines</option>
            </select>

            <label>Occupation</label>
            <select id="occupation" class="form-select mb-2">
                <option value="">Select</option>
                <option>Student</option>
                <option>Corporate</option>
                <option>Business</option>
                <option>Housewife</option>
                <option>Others</option>
            </select>

            <label>Self Employed</label>
            <select id="self_employed" class="form-select mb-2">
                <option value="">Select</option>
                <option>No</option>
                <option>Yes</option>
            </select>

            <label>Family History</label>
            <select id="family_history" class="form-select mb-2">
                <option value="">Select</option>
                <option>No</option>
                <option>Yes</option>
            </select>

            <label>Mental Health History</label>
            <select id="mental_health_history" class="form-select mb-2">
                <option value="">Select</option>
                <option>No</option>
                <option>Maybe</option>
                <option>Yes</option>
            </select>

            <label>Days Indoors</label>
            <select id="days_indoors" class="form-select mb-2">
                <option value="">Select</option>
                <option>Go Out Every Day</option>
                <option>1-14 days</option>
                <option>15-30 days</option>
                <option>31-60 days</option>
                <option>More than 2 months</option>
            </select>

            <label>Growing Stress</label>
            <select id="growing_stress" class="form-select mb-2">
                <option value="">Select</option>
                <option>No</option>
                <option>Maybe</option>
                <option>Yes</option>
            </select>

            <label>Changes in Habits</label>
            <select id="changes_habits" class="form-select mb-2">
                <option value="">Select</option>
                <option>No</option>
                <option>Maybe</option>
                <option>Yes</option>
            </select>

            <label>Mood Swings</label>
            <select id="mood_swings" class="form-select mb-2">
                <option value="">Select</option>
                <option>Low</option>
                <option>Medium</option>
                <option>High</option>
            </select>

            <label>Coping Struggles</label>
            <select id="coping_struggles" class="form-select mb-2">
                <option value="">Select</option>
                <option>No</option>
                <option>Maybe</option>
                <option>Yes</option>
            </select>

            <label>Work Interest</label>
            <select id="work_interest" class="form-select mb-2">
                <option value="">Select</option>
                <option>No</option>
                <option>Maybe</option>
                <option>Yes</option>
            </select>

            <label>Social Weakness</label>
            <select id="social_weakness" class="form-select mb-2">
                <option value="">Select</option>
                <option>No</option>
                <option>Maybe</option>
                <option>Yes</option>
            </select>

            <label>Mental Health Interview</label>
            <select id="mental_health_interview" class="form-select mb-2">
                <option value="">Select</option>
                <option>No</option>
                <option>Yes</option>
            </select>

            <label>Care Options</label>
            <select id="care_options" class="form-select mb-3">
                <option value="">Select</option>
                <option>No</option>
                <option>Not sure</option>
                <option>Yes</option>
            </select>

            <button type="button" class="btn btn-primary w-100" onclick="submitData()">Predict</button>
        </form>

        <div id="result" class="mt-3 text-center fw-bold"></div>
    </div>

    <script>
        function submitData() {
            const data = {
                Gender: gender.value,
                Country: country.value,
                Occupation: occupation.value,
                self_employed: self_employed.value,
                family_history: family_history.value,
                Mental_Health_History: mental_health_history.value,
                Days_Indoors: days_indoors.value,
                Growing_Stress: growing_stress.value,
                Changes_Habits: changes_habits.value,
                Mood_Swings: mood_swings.value,
                Coping_Struggles: coping_struggles.value,
                Work_Interest: work_interest.value,
                Social_Weakness: social_weakness.value,
                mental_health_interview: mental_health_interview.value,
                care_options: care_options.value
            };

            const resultDiv = document.getElementById("result");
            resultDiv.innerHTML = "Predicting...";

            fetch("http://127.0.0.1:5000/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
                .then(response => response.json())
                .then(response => {
                    console.log("Backend response:", response);

                    if (response.error) {
                        resultDiv.innerHTML = "Error: " + response.error;
                    } else {
                        resultDiv.innerHTML =
                            (response.prediction === 1 ? "Treatment Required" : "No Treatment Required")
                            + "<br>Probability: " + response.probability + "%";
                    }
                })
                .catch(error => {
                    console.error("Fetch error:", error);
                    resultDiv.innerHTML = "Something went wrong";
                });
        }
    </script>


</body>

</html>
